<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.47/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
</head>
<body>
    <div class="container">
    <h1> 🌍World Clock🌎</h1>

    <select id="city">
        <option value="">Choose a city...</option>
        <option value="current">Current location</option>
        <option value="Europe/London">London</option>
        <option value="Europe/Paris">Paris</option>
        <option value="Asia/Tokyo">Tokyo</option>
        
    </select>

   <div id="cities">
    <div class="city" id="london">
        <div>
        <h2>London 🇬🇧</h2>
        <div class="date"> </div>
    </div>
        <div class="time"> </div>
    </div>
    <div class="city" id="paris">
        <div>
        <h2>Paris 🇫🇷</h2>
        <div class="date"></div>
    </div>
        <div class="time"></div>
    </div>
    <div class="city" id="tokyo">
        <div>
        <h2>Tokyo🇯🇵</h2>
        <div class="date"></div>
    </div>
        <div class="time"></div>
    </div>
</div>
<button class="home-button hidden" id="refresh">HOME</button>

</div>
<footer>
        This project was coded by <strong>Stella Maris</strong> and is open source on <a href="https://github.com/smstellar91/world-clock" target="_blank"> Github.</a> and hosted on <a href="https://world-clock-sm1.netlify.app/" target="_blank">Netlify</a>
    </footer>
    <script src="javascript/index.js"></script>
</body>
</html>
