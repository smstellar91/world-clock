<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>World Clock</title>
</head>
<body>
    <div class="container">
    <h1> World Clock🌎</h1>

    <select>
        <option value="">Choose a city...</option>
        <option value="london">London</option>
        <option value="paris">Paris</option>
        <option value="Tokyo">Tokyo</option>
        <option value="Sydney">Sydney</option>
    </select>

    <div class="city">
        <div>
        <h2>London 🇬🇧</h2>
        <div class="date"> April 14th 2025</div>
    </div>
        <div class="time"> 12:00 <small>PM</small></div>
    </div>
    <div class="city">
        <div>
        <h2>Paris 🇺🇸</h2>
        <div class="date"> April 14th 2025</div>
    </div>
        <div class="time"> 12:00 <small>PM</small></div>
    </div>
    <div class="city">
        <div>
        <h2>Tokyo🇯🇵</h2>
        <div class="date"> April 14th 2025</div>
    </div>
        <div class="time"> 12:00 <small>PM</small></div>
    </div>
    <div class="city">
        <div>
        <h2>Seoul🇰🇷</h2>
        <div class="date"> April 14th 2025</div>
    </div>
        <div class="time"> 12:00 <small>PM</small></div>
    </div>
</div>

<footer>
        This project was coded by <strong>Stella Maris</strong> and is open source on <a href="https://github.com/smstellar91/world-clock" target="_blank"> Github.</a>
    </footer>
    <script src="javascript/index.js"></script>
</body>
</html>
