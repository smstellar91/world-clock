<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.47/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
</head>
<body>
    <div class="container">
    <h1> World Clock🌎</h1>

    <select>
        <option value="">Choose a city...</option>
        <option value="">Current location</option>
        <option value="london">London</option>
        <option value="paris">Paris</option>
        <option value="Tokyo">Tokyo</option>
        <option value="Sydney">Sydney</option>
    </select>

    <div class="city" id="london">
        <div>
        <h2>London 🇬🇧</h2>
        <div class="date"> </div>
    </div>
        <div class="time"> </div>
    </div>
    <div class="city" id="paris">
        <div>
        <h2>Paris 🇫🇷</h2>
        <div class="date"></div>
    </div>
        <div class="time"></div>
    </div>
    <div class="city" id="tokyo">
        <div>
        <h2>Tokyo🇯🇵</h2>
        <div class="date"></div>
    </div>
        <div class="time"></div>
    </div>
    
</div>

<footer>
        This project was coded by <strong>Stella Maris</strong> and is open source on <a href="https://github.com/smstellar91/world-clock" target="_blank"> Github.</a>
    </footer>
    <script src="javascript/index.js"></script>
</body>
</html>
